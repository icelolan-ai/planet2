name: Native Cosmic Launch UI QA
on:
  push:
    branches: [feat/launch-cosmos-20261011]
    paths: ['src/**', 'docs/qa/launch-cosmos-ui.cjs', '.github/workflows/launch-cosmos-qa.yml']
  workflow_run:
    workflows: ['Build generated site']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-cosmos-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: '{"width":1440,"height":900}'
            dpr: '1'
          - viewport: '{"width":390,"height":844}'
            dpr: '3'
          - viewport: '{"width":820,"height":1180}'
            dpr: '2'
          - viewport: '{"width":844,"height":390}'
            dpr: '1'
          - viewport: '{"width":320,"height":568}'
            dpr: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          npm install --prefix /tmp/launch-cosmos-qa playwright
          /tmp/launch-cosmos-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and serve source
        if: github.event_name != 'workflow_run' && github.ref_name != 'test/rocket-live-20261011'
        run: |
          python3 src/build_web.py
          python3 -m http.server 8000 > /tmp/rocket-http.log 2>&1 &
      - name: Wait for generated bundle on Pages
        if: github.event_name == 'workflow_run' || github.ref_name == 'test/rocket-live-20261011'
        run: |
          python3 - <<'PY'
          import pathlib,re,time,urllib.request
          expected=re.search(r'assets/app\.[a-f0-9]+\.js',pathlib.Path('index.html').read_text()).group()
          for attempt in range(24):
              try:
                  actual=urllib.request.urlopen('https://icelolan-ai.github.io/planet2/',timeout=15).read().decode()
                  if expected in actual:
                      print('Deployed bundle',expected)
                      break
              except Exception as error:
                  print(error)
              time.sleep(5)
          else:
              raise SystemExit('Pages did not publish expected bundle '+expected)
          PY
      - name: Verify native menu, gestures, routes and atmosphere
        env:
          NODE_PATH: /tmp/launch-cosmos-qa/node_modules
          VP: ${{ matrix.viewport }}
          QA_DPR: ${{ matrix.dpr }}
          QA_EXPORT: '0'
          QA_URL: ${{ (github.event_name == 'workflow_run' || github.ref_name == 'test/rocket-live-20261011') && 'https://icelolan-ai.github.io/planet2/' || 'http://127.0.0.1:8000' }}
          QA_SCREENSHOT_DIR: /tmp/launch-cosmos-screenshots
        run: |
          mkdir -p /tmp/launch-cosmos-screenshots
          export QA_CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')
          node docs/qa/launch-cosmos-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmos-${{ strategy.job-index }}-${{ github.event_name }}
          path: /tmp/launch-cosmos-screenshots
