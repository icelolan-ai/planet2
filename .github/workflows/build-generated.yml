name: Build generated site

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/build-generated.yml'
  push:
    branches: [main]
    paths:
      - 'src/template.html'
      - 'src/worlds.json'
      - 'src/effects/**'
      - 'src/build_web.py'
      - '.github/workflows/build-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerebra-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build generated site
        run: python3 src/build_web.py

      - name: Validate generated output
        run: |
          git diff --check
          git status --short
          test -f index.html
          test -d assets

      - name: Commit generated output on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html assets; then
            echo 'Generated output already current.'
            exit 0
          fi
          git config user.name 'cerebra-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets
          git commit -m 'Build generated site'
          git push origin HEAD:main
